site_name: Maths Self Study
repo_url: https://github.com/tkm212/maths-self-study
site_url: https://tkm212.github.io/maths-self-study
site_description: Marimo notebooks and Python code for self-directed study in maths, statistics, and machine learning — chapter-by-chapter from classic textbooks
site_author: tkm
edit_uri: edit/main/docs/
repo_name: tkm212/maths-self-study
copyright: Maintained by <a href="https://github.com/tkm212">tkm212</a>.

nav:
  - Home: index.md
  - Notebooks: notebooks.md
  - API Reference: modules.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tkm212/maths-self-study
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/maths-self-study

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
